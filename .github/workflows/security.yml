name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --extra dev --locked
      - run: uv run bandit -q -r src locked prepare.py evaluate.py research.py scheduler.py security.py verify_runner.py scripts/pipeline_recovery.py
      - run: uv export --extra dev --no-emit-project --locked --output-file /tmp/requirements.txt
      - run: uv run pip-audit --requirement /tmp/requirements.txt
