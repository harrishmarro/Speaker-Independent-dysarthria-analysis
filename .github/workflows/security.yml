name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --extra dev --locked
      - run: uv run bandit -q -r src locked prepare.py evaluate.py research.py scheduler.py security.py verify_runner.py scripts/pipeline_recovery.py
      - run: uv export --extra dev --no-emit-project --locked --output-file /tmp/requirements.txt
      - run: uv run pip-audit --requirement /tmp/requirements.txt
