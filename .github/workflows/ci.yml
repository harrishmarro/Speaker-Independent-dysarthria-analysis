name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src locked prepare.py evaluate.py research.py scheduler.py security.py verify_runner.py scripts/pipeline_recovery.py
      - run: uv run pytest
      - run: uv run dysarthria-data validate data/sample_manifest.csv
