name: Pipeline recovery

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
      - Security
      - Dependency review
      - Secure autoresearch cycle
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pipeline-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-model-access:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify recovery mode without reading project data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECOVERY_MODEL: gpt-6-sol
          RECOVERY_SELF_CHECK: '1'
        run: python scripts/pipeline_recovery.py
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Diagnose and recover within policy
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECOVERY_MODEL: gpt-6-sol
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: python scripts/pipeline_recovery.py
