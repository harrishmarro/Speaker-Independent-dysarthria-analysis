name: Secure autoresearch cycle

on:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "prepare.py"
      - "evaluate.py"
      - "security.py"
      - "research.py"
      - "verify_runner.py"
      - "autoresearch/**"
      - ".github/workflows/autoresearch.yml"
  schedule:
    # Check every ten minutes; the persisted gate enforces a full ten-minute interval.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dysarthria-autoresearch
  cancel-in-progress: false

jobs:
  gpu-experiment:
    runs-on: [self-hosted, dysarthria-gpu]
    timeout-minutes: 330
    env:
      # GitHub-hosted runners provide /Users/runner automatically. Use the
      # checked-out workspace on this self-hosted Mac instead.
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.toolcache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
      - name: Check ten-minute eligibility
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scheduler.py due --minutes 10 >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare local tool cache
        if: steps.schedule.outputs.due == 'true'
        run: mkdir -p "$RUNNER_TOOL_CACHE"
      - name: Use local uv installation
        if: steps.schedule.outputs.due == 'true'
        shell: bash
        run: |
          uv_bin="$(command -v uv || true)"
          for candidate in "$HOME/.local/bin/uv" /opt/homebrew/bin/uv /usr/local/bin/uv; do
            if [[ -z "$uv_bin" && -x "$candidate" ]]; then uv_bin="$candidate"; fi
          done
          [[ -n "$uv_bin" ]] || { echo "uv is not installed on the self-hosted runner"; exit 1; }
          uv_dir="$(dirname "$uv_bin")"
          echo "$uv_dir" >> "$GITHUB_PATH"
          "$uv_bin" --version
      - if: steps.schedule.outputs.due == 'true'
        run: uv sync --python 3.14 --extra dev --extra model --locked
      - name: Verify private manifest and local accelerator
        if: steps.schedule.outputs.due == 'true'
        run: uv run python verify_runner.py --manifest "$DYSARTHRIA_MANIFEST"
      - if: steps.schedule.outputs.due == 'true'
        run: uv run python security.py train.py
      - if: steps.schedule.outputs.due == 'true'
        run: uv run ruff check .
      - if: steps.schedule.outputs.due == 'true'
        run: uv run pytest
      - name: Run controlled research harness
        if: steps.schedule.outputs.due == 'true'
        run: uv run python research.py --mode experiment --manifest "$DYSARTHRIA_MANIFEST"
      - name: Mark completed cycle
        if: steps.schedule.outputs.due == 'true'
        run: python scheduler.py mark
      - name: Commit new experiment record
        if: steps.schedule.outputs.due == 'true'
        shell: bash
        run: |
          if git diff --quiet -- experiments/registry.tsv experiments/schedule_state.json; then
            echo "No new experiment or scheduler state to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/registry.tsv experiments/schedule_state.json
          git commit -m "Record scheduled research cycle"
          git push
