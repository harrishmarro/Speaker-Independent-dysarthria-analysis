name: Secure autoresearch cycle

on:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "prepare.py"
      - "evaluate.py"
      - "security.py"
      - "research.py"
      - "verify_runner.py"
      - "autoresearch/**"
      - ".github/workflows/autoresearch.yml"
  schedule:
    # Check hourly; the persisted gate enforces a full five-hour interval.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dysarthria-autoresearch
  cancel-in-progress: false

jobs:
  gpu-experiment:
    runs-on: [self-hosted, dysarthria-gpu]
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
      - name: Check five-hour eligibility
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scheduler.py due --hours 5 >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.schedule.outputs.due == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.schedule.outputs.due == 'true'
      - if: steps.schedule.outputs.due == 'true'
        run: uv sync --extra dev --extra model --locked
      - name: Verify private manifest and local accelerator
        if: steps.schedule.outputs.due == 'true'
        run: uv run python verify_runner.py --manifest "$DYSARTHRIA_MANIFEST"
      - if: steps.schedule.outputs.due == 'true'
        run: uv run python security.py train.py
      - if: steps.schedule.outputs.due == 'true'
        run: uv run ruff check .
      - if: steps.schedule.outputs.due == 'true'
        run: uv run pytest
      - name: Run controlled research harness
        if: steps.schedule.outputs.due == 'true'
        run: uv run python research.py --mode experiment --manifest "$DYSARTHRIA_MANIFEST"
      - name: Mark completed cycle
        if: steps.schedule.outputs.due == 'true'
        run: python scheduler.py mark
      - name: Commit new experiment record
        if: steps.schedule.outputs.due == 'true'
        shell: bash
        run: |
          if git diff --quiet -- experiments/registry.tsv experiments/schedule_state.json; then
            echo "No new experiment or scheduler state to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/registry.tsv experiments/schedule_state.json
          git commit -m "Record scheduled research cycle"
          git push
