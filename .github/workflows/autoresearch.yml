name: Secure autoresearch cycle

on:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "prepare.py"
      - "evaluate.py"
      - "security.py"
      - "research.py"
      - "verify_runner.py"
      - "autoresearch/**"
      - ".github/workflows/autoresearch.yml"
  schedule:
    # Check every ten minutes; the persisted gate enforces a full ten-minute interval.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dysarthria-autoresearch
  cancel-in-progress: false

jobs:
  gpu-experiment:
    runs-on: [self-hosted, dysarthria-gpu]
    timeout-minutes: 330
    env:
      # GitHub-hosted runners provide /Users/runner automatically. Use the
      # checked-out workspace on this self-hosted Mac instead.
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.toolcache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
      - name: Use local uv installation
        shell: bash
        run: |
          uv_bin="$(command -v uv || true)"
          for candidate in "$HOME/.local/bin/uv" /opt/homebrew/bin/uv /usr/local/bin/uv; do
            if [[ -z "$uv_bin" && -x "$candidate" ]]; then uv_bin="$candidate"; fi
          done
          [[ -n "$uv_bin" ]] || { echo "uv is not installed on the self-hosted runner"; exit 1; }
          echo "$(dirname "$uv_bin")" >> "$GITHUB_PATH"
          "$uv_bin" --version
      - name: Check ten-minute eligibility
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            uv run --python 3.14 python scheduler.py due --minutes 10 >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare local tool cache
        if: steps.schedule.outputs.due == 'true'
        run: mkdir -p "$RUNNER_TOOL_CACHE"
      - if: steps.schedule.outputs.due == 'true'
        run: uv sync --python 3.14 --extra dev --extra model --locked
      - name: Verify private manifest and local accelerator
        if: steps.schedule.outputs.due == 'true'
        run: uv run python verify_runner.py --manifest "$DYSARTHRIA_MANIFEST"
      - if: steps.schedule.outputs.due == 'true'
        run: uv run python security.py train.py
      - if: steps.schedule.outputs.due == 'true'
        run: uv run ruff check .
      - if: steps.schedule.outputs.due == 'true'
        run: uv run pytest
      - name: Prepare bounded candidate
        if: steps.schedule.outputs.due == 'true'
        id: candidate
        run: uv run python autoresearch/decide.py prepare >> "$GITHUB_OUTPUT"
      - name: Validate proposed candidate
        if: steps.candidate.outputs.candidate_available == 'true'
        run: |
          uv run python security.py train.py
          uv run ruff check .
          uv run pytest
      - name: Run controlled research harness
        if: steps.candidate.outputs.candidate_available == 'true'
        shell: bash
        run: |
          if ! uv run python research.py --mode experiment --manifest "$DYSARTHRIA_MANIFEST" > run.log 2>&1; then
            tail -n 50 run.log
            exit 1
          fi
          tail -n 8 run.log
      - name: Assess candidate against accepted baseline
        if: steps.candidate.outputs.candidate_available == 'true'
        id: decision
        run: uv run python autoresearch/decide.py assess >> "$GITHUB_OUTPUT"
      - name: Mark completed cycle
        if: steps.schedule.outputs.due == 'true'
        run: uv run --python 3.14 python scheduler.py mark
      - name: Record rejected result and restore baseline
        if: steps.candidate.outputs.candidate_available == 'true' && steps.decision.outputs.improved == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/registry.tsv experiments/search_state.json experiments/schedule_state.json
          git commit -m "research: record non-improving candidate"
          bash scripts/push_main_with_retry.sh
      - name: Propose improved candidate for review
        if: steps.candidate.outputs.candidate_available == 'true' && steps.decision.outputs.improved == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/search_state.json experiments/schedule_state.json
          git commit -m "research: record candidate decision state"
          bash scripts/push_main_with_retry.sh
          branch="research/${{ steps.decision.outputs.experiment_id }}"
          git switch -c "$branch"
          git add configs/research/active.json configs/research/baseline.json experiments/registry.tsv
          git commit -m "research: propose ${{ steps.decision.outputs.candidate_name }}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Research: review ${{ steps.decision.outputs.candidate_name }}" \
            --body "Validation balanced accuracy improved over the accepted baseline. Review the experiment record, speaker-level evidence, and code before merging. No held-out test result was used for selection."
          gh pr edit "$branch" --add-reviewer harrishmarro
