name: Secure autoresearch cycle

on:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "prepare.py"
      - "evaluate.py"
      - "security.py"
      - "research.py"
      - "autoresearch/**"
      - ".github/workflows/autoresearch.yml"
  schedule:
    - cron: "23 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dysarthria-autoresearch
  cancel-in-progress: false

jobs:
  smoke-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --extra dev --locked
      - run: uv run python security.py train.py
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Run controlled research harness
        run: uv run python research.py --mode smoke
      - name: Commit new experiment record
        shell: bash
        run: |
          if git diff --quiet -- experiments/registry.tsv; then
            echo "No new experiment signature to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/registry.tsv
          git commit -m "Record scheduled research cycle"
          git push
